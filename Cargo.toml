[package]
name = "php_cassandra_driver"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal PHP Cassandra client extension written in Rust."

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = { version = "0.15.14" }
once_cell = "1.21.3"
scylla = { version = "1.6.0", default-features = false, features = ["rustls-023"] }
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
